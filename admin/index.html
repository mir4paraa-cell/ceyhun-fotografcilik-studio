<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Girişi | Ceyhun Fotoğrafçılık</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0b0b0b;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:420px;
    background:#151515;
    border:1px solid #292929;
    border-radius:22px;
    padding:40px;
    box-shadow:0 25px 80px rgba(0,0,0,.45);
}

.logo{
    text-align:center;
    font-size:13px;
    letter-spacing:4px;
    color:#aaa;
    margin-bottom:12px;
}

h1{
    text-align:center;
    font-size:32px;
    font-weight:500;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#888;
    font-size:14px;
    margin-bottom:35px;
}

label{
    display:block;
    font-size:13px;
    color:#bbb;
    margin-bottom:8px;
}

input{
    width:100%;
    padding:14px 15px;
    border-radius:12px;
    border:1px solid #333;
    background:#0d0d0d;
    color:#fff;
    outline:none;
    margin-bottom:20px;
    font-size:15px;
}

input:focus{
    border-color:#777;
}

button{
    width:100%;
    padding:15px;
    border:0;
    border-radius:30px;
    background:#fff;
    color:#111;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

#error{
    display:none;
    margin-top:18px;
    padding:12px;
    border-radius:10px;
    background:#321515;
    border:1px solid #632727;
    color:#ffb0b0;
    font-size:13px;
    text-align:center;
}

.back{
    display:block;
    text-align:center;
    margin-top:25px;
    color:#888;
    text-decoration:none;
    font-size:13px;
}

.back:hover{
    color:#fff;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        CEYHUN FOTOĞRAFÇILIK
    </div>

    <h1>Admin Girişi</h1>

    <div class="subtitle">
        Yönetim paneline giriş yapın.
    </div>

    <form id="loginForm">

        <label for="email">E-posta</label>

        <input
            id="email"
            type="email"
            placeholder="Admin e-posta adresiniz"
            required
        >

        <label for="password">Şifre</label>

        <input
            id="password"
            type="password"
            placeholder="Şifreniz"
            required
        >

        <button type="submit">
            Admin Girişi Yap
        </button>

    </form>

    <div id="error"></div>

    <a class="back" href="/">
        ← Ana siteye dön
    </a>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit", function(e){

    e.preventDefault();

    const error = document.getElementById("error");

    error.style.display = "block";

    error.textContent =
        "Admin bağlantısı henüz etkinleştirilmedi. Bir sonraki adımda Supabase'e bağlayacağız.";

});

</script>

</body>
</html>
