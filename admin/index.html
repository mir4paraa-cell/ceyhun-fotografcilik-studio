<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Girişi | Ceyhun Fotoğrafçılık</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0b0b0b;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:420px;
    background:#151515;
    border:1px solid #292929;
    border-radius:22px;
    padding:40px;
    box-shadow:0 25px 80px rgba(0,0,0,.45);
}

.logo{
    text-align:center;
    font-size:13px;
    letter-spacing:4px;
    color:#aaa;
    margin-bottom:12px;
}

h1{
    text-align:center;
    font-size:32px;
    font-weight:500;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#888;
    font-size:14px;
    margin-bottom:35px;
}

label{
    display:block;
    font-size:13px;
    color:#bbb;
    margin-bottom:8px;
}

input{
    width:100%;
    padding:14px 15px;
    border-radius:12px;
    border:1px solid #333;
    background:#0d0d0d;
    color:#fff;
    outline:none;
    margin-bottom:20px;
    font-size:15px;
}

input:focus{
    border-color:#777;
}

button{
    width:100%;
    padding:15px;
    border:0;
    border-radius:30px;
    background:#fff;
    color:#111;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

#error{
    display:none;
    margin-top:18px;
    padding:12px;
    border-radius:10px;
    background:#321515;
    border:1px solid #632727;
    color:#ffb0b0;
    font-size:13px;
    text-align:center;
}

.back{
    display:block;
    text-align:center;
    margin-top:25px;
    color:#888;
    text-decoration:none;
    font-size:13px;
}

.back:hover{
    color:#fff;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        CEYHUN FOTOĞRAFÇILIK
    </div>

    <h1>Admin Girişi</h1>

    <div class="subtitle">
        Yönetim paneline giriş yapın.
    </div>

    <form id="loginForm">

        <label for="email">E-posta</label>

        <input
            id="email"
            type="email"
            placeholder="Admin e-posta adresiniz"
            autocomplete="email"
            required
        >

        <label for="password">Şifre</label>

        <input
            id="password"
            type="password"
            placeholder="Şifreniz"
            autocomplete="current-password"
            required
        >

        <button id="loginButton" type="submit">
            Admin Girişi Yap
        </button>

    </form>

    <div id="error"></div>

    <a class="back" href="/">
        ← Ana siteye dön
    </a>

</div>

<script type="module">

import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/* ==============================
   SUPABASE AYARLARI
   ============================== */

const SUPABASE_URL =
"https://nzriewxchkcfeknkbwuu.supabase.co";

/*
   Buraya daha önce kullandığımız
   SUPABASE PUBLISHABLE KEY gelecek.

   Güvenlik nedeniyle anahtarı burada
   tekrar göstermiyorum.
*/
const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_tZemFcdKUDB-l7ozX2ezbA_rK542nOI";


const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


/* ==============================
   ELEMENTLER
   ============================== */

const loginForm =
document.getElementById("loginForm");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loginButton =
document.getElementById("loginButton");

const errorBox =
document.getElementById("error");


/* ==============================
   HATA GÖSTER
   ============================== */

function showError(message){

    errorBox.textContent = message;
    errorBox.style.display = "block";

}


/* ==============================
   GİRİŞ
   ============================== */

loginForm.addEventListener("submit", async function(e){

    e.preventDefault();

    errorBox.style.display = "none";

    const email =
    emailInput.value.trim();

    const password =
    passwordInput.value;

    if(!email || !password){

        showError(
            "E-posta ve şifre gerekli."
        );

        return;
    }

    loginButton.disabled = true;

    loginButton.textContent =
    "Giriş yapılıyor...";


    try{

        const {
            data,
            error
        } = await supabase.auth.signInWithPassword({

            email: email,

            password: password

        });


        if(error){

            throw error;

        }


        if(!data.user){

            throw new Error(
                "Kullanıcı bulunamadı."
            );

        }


        /* ==========================
           PROFİLİ KONTROL ET
           ========================== */

        const {
            data: profile,
            error: profileError
        } = await supabase

            .from("profiles")

            .select("role, full_name")

            .eq("id", data.user.id)

            .single();


        if(profileError){

            await supabase.auth.signOut();

            throw new Error(
                "Admin profili bulunamadı."
            );

        }


        /* ==========================
           ADMIN KONTROLÜ
           ========================== */

        if(profile.role !== "admin"){

            await supabase.auth.signOut();

            throw new Error(
                "Bu hesap admin yetkisine sahip değil."
            );

        }


        /* ==========================
           ADMIN PANELİNE GİT
           ========================== */

        window.location.href =
        "/admin/panel.html";


    }catch(error){

        console.error(error);

        showError(
            error.message ||
            "Giriş sırasında bir hata oluştu."
        );

        loginButton.disabled = false;

        loginButton.textContent =
        "Admin Girişi Yap";

    }

});

</script>

</body>
</html>
